<!DOCTYPE html>
<!--
  ==========================================================================
  Query-X  |  Campus AI Assistant  (RAG chatbot front-end)
  ==========================================================================
  This file is only the STRUCTURE (the skeleton) of the page.
    - style.css  -> how it looks
    - script.js  -> how it behaves (sending questions, showing answers, etc.)

  The page has 3 columns (like the reference image):
    1. LEFT   : <aside class="sidebar">   -> new chat, chat history, settings
    2. MIDDLE : <main class="chat">       -> messages + input box
    3. RIGHT  : <aside class="sources">   -> sources / citations of the answer
  ==========================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Query-X | Campus AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <!-- ============================================================
         LEFT COLUMN : SIDEBAR
         ============================================================ -->
    <aside class="sidebar" id="sidebar">

      <!-- Brand / logo -->
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">Q</div>
        <div>
          <h1 class="brand-name">Query-X</h1>
          <p class="brand-tag">Your Campus AI Assistant</p>
        </div>
      </div>

      <!-- Starts a fresh conversation (script.js -> newChat()) -->
      <button class="btn-primary" id="newChatBtn">＋ New Chat</button>

      <!-- Title row of the history list + clear-history button -->
      <div class="side-row">
        <span class="side-title">Chat History</span>
        <button class="link-btn" id="clearHistoryBtn" title="Delete all chats of this session">Clear all</button>
      </div>

      <!-- The list of previous chats is generated by script.js (renderChatList) -->
      <ul class="chat-list" id="chatList" aria-label="Previous chats"></ul>

      <!-- Decorative campus illustration (pure SVG, no image file needed) -->
      <svg class="side-art" viewBox="0 0 220 120" aria-hidden="true">
        <rect x="0" y="95" width="220" height="25" rx="6" fill="#e4dcff"/>
        <rect x="60" y="35" width="100" height="60" fill="#fff" stroke="#b9a8ff" stroke-width="2"/>
        <polygon points="50,35 110,8 170,35" fill="#8b6cf6"/>
        <rect x="100" y="60" width="20" height="35" fill="#b9a8ff"/>
        <rect x="70" y="50" width="16" height="16" fill="#e4dcff"/>
        <rect x="134" y="50" width="16" height="16" fill="#e4dcff"/>
        <circle cx="30" cy="78" r="14" fill="#a68cf7"/><rect x="28" y="88" width="4" height="12" fill="#7a5cd6"/>
        <circle cx="192" cy="78" r="14" fill="#a68cf7"/><rect x="190" y="88" width="4" height="12" fill="#7a5cd6"/>
      </svg>

      <button class="settings-btn" id="settingsBtn">⚙ Settings</button>
    </aside>

    <!-- ============================================================
         MIDDLE COLUMN : CHAT
         ============================================================ -->
    <main class="chat">

      <!-- Top bar -->
      <header class="chat-header">
        <!-- Hamburger: only visible on small screens, opens the sidebar -->
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>

        <div class="header-title">
          <h2>Campus Assistant</h2>
        </div>

        <!-- Language selector: used for voice input AND sent to the backend -->
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
        </select>

        <span class="status" id="statusBadge"><i class="dot"></i><span id="statusText">Online</span></span>
      </header>

      <!-- All chat bubbles are inserted here by script.js (renderMessages) -->
      <section class="messages" id="messages" aria-live="polite"></section>

      <!-- Input area -->
      <footer class="composer">
        <div class="composer-box">
          <!-- Attach is a placeholder for a future "upload PDF" feature -->
          <button class="icon-btn" id="attachBtn" title="Upload PDF (coming soon)" disabled>📎</button>

          <!-- Enter = send, Shift+Enter = new line (handled in script.js) -->
          <textarea id="input" rows="1" placeholder="Ask anything about your campus..." aria-label="Type your question"></textarea>

          <!-- Voice input (Web Speech API) -->
          <button class="icon-btn" id="micBtn" title="Speak your question" aria-label="Voice input">🎤</button>

          <button class="send-btn" id="sendBtn" title="Send" aria-label="Send">➤</button>
        </div>
        <p class="hint" id="hint">Enter to send · Shift + Enter for a new line</p>
      </footer>
    </main>

    <!-- ============================================================
         RIGHT COLUMN : SOURCES PANEL
         Shows the PDF pages / passages that support the latest answer.
         ============================================================ -->
    <aside class="sources" id="sourcesPanel">
      <h3 class="panel-title">Sources</h3>
      <div id="sourceList" class="source-list">
        <p class="muted">Sources used for an answer will appear here.</p>
      </div>

      <div class="tip">
        <strong>💡 Tip</strong>
        <p id="tipText">You can also ask in Hindi, e.g. “कैंपस इवेंट कब है?”</p>
      </div>
    </aside>
  </div>

  <!-- ============================================================
       SETTINGS POPUP (native <dialog> element)
       ============================================================ -->
  <dialog id="settingsDialog" class="dialog">
    <form method="dialog">
      <h3>Settings</h3>

      <label class="field">
        <input type="checkbox" id="mockToggle" />
        Demo mode (fake answers, no backend needed)
      </label>

      <label class="field col">
        Backend URL
        <input type="text" id="apiUrlInput" placeholder="/api/chat" />
      </label>

      <div class="dialog-actions">
        <button class="btn-primary" value="close">Save &amp; Close</button>
      </div>
    </form>
  </dialog>

  <!-- Dark overlay behind the sidebar on mobile -->
  <div class="overlay" id="overlay"></div>

  <script src="script.js"></script>
</body>
</html>
